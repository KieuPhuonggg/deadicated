<style>
/* Layout: full-bleed WebGL stage; HTML overlays = red-lacquer title plaque, bottom action bar, right/bottom picker sheet, woven-mat (chiếu) modal */
:root{
  --ink:#2a140c; --lacquer:#5a2a16; --cinnabar:#b3261e; --gold:#e8b84a; --jade:#3fa093;

}
[hidden]{display:none!important}

.btn-red{background:var(--cinnabar);color:#ffe9b8;box-shadow:0 3px 0 #6e130e,0 8px 18px rgba(0,0,0,.3)}

  box-shadow:0 0 0 3px #2a0b07,0 0 0 5px var(--gold),0 0 0 7px #2a0b07,0 14px 30px rgba(0,0,0,.4);transition:opacity .8s;max-width:calc(100vw - 48px)}

function haveFor(r){for(const k in r.need)if(invN(k)<r.need[k])return false;if(r.any&&!r.any.some(o=>Object.keys(o).every(k=>invN(k)>=o[k])))return false;return true;}

function consume(r){for(const k in r.need)addInv(k,-r.need[k]);if(r.any){const o=r.any.find(o=>Object.keys(o).every(k=>invN(k)>=o[k]));if(o)for(const k in o)addInv(k,-o[k]);}}
ckEl.addEventListener('click',e=>{const b=e.target.closest('button');if(!b){if(e.target===ckEl&&!CK.rec)closeCook();return;}const d=b.dataset.ck;
  if(d==='x')closeCook();
  else if(d&&d.indexOf('r:')===0){const r=REC.find(q=>q.id===d.slice(2));if(!haveFor(r)){toast(L('Thiếu nguyên liệu: ','Missing: ')+missingTxt(r),3200);return;}CK.rec=r;CK.step=0;renderCook();}
  else if(d==='n'){CK.step++;renderCook();}
  else if(d==='hit'){cancelAnimationFrame(ckRAF);const r=CK.rec,dist=Math.abs(CK.pos-.5),q=dist<.07?3:dist<.15?2:1;consume(r);addInv('dish:'+r.id,1);CK.tut=0;CK.rec=null;

 const end=ok=>{if(over)return;over=true;cancelAnimationFrame(gmRAF);gmClose();GS.energy=Math.max(0,GS.energy-8);cb(ok);};

 gmBox('<b style="font-size:19px">'+title+'</b><p style="margin:6px 0">'+hint+'</p><div style="position:relative;height:30px;background:#e0d2b0;border-radius:15px;overflow:hidden;margin:8px 0"><div style="position:absolute;left:38%;width:24%;top:0;bottom:0;background:#9ad07a"></div><div id="tmk" style="position:absolute;top:0;bottom:0;width:8px;background:#c4261c"></div></div><p id="tst" style="margin:4px 0"></p><button id="tgB" style="'+gbtn+'">'+L('Giữ thăng bằng!','Balance!')+'</button>');
 const st=()=>{$('#tst').textContent='✔ '+ok+'/'+need+'   ✘ '+bad+'/3';};st();
 const end=r=>{if(over)return;over=true;cancelAnimationFrame(gmRAF);gmClose();GS.energy=Math.max(0,GS.energy-8);cb(r);};
 gmEl.onclick=e=>{if(over||e.target.id!=='tgB')return;if(Math.abs(pos-.5)<.12)ok++;else bad++;st();if(ok>=need)end(true);else if(bad>=3)end(false);};

 love:{k:['yêu','crush','người yêu','chia tay','thích','tình','bồ','love','girlfriend','boyfriend','date','breakup'],l:['Thương ai thì nói cho tường','Lời hay nói sớm kẻo đường lỡ duyên.'],s:'Gia tiên nhắn nhủ',e:'If you care for someone, say it plainly, and say it early before the chance slips away.'},
 money:{k:['tiền','nợ','giá','lỗ','lãi','tiết kiệm','money','debt','rent','salary','broke'],l:['Tiền nong con tính cho yên','Biết đủ là quý mới nên cửa nhà.'],s:'Gia tiên nhắn nhủ',e:'Plan your money so you can rest easy; knowing what is enough is what builds a home.'},
 work:{k:['việc','sếp','công ty','deadline','đi làm','dự án','work','boss','job','career'],l:['Việc nhiều con cứ thong dong','Đường dài bước chậm vẫn mong tới nhà.'],s:'Gia tiên nhắn nhủ',e:'Plenty of work? Stay unhurried; a long road walked slowly still gets you home.'},
 health:{k:['mệt','ốm','đau','ngủ','sức khỏe','bệnh','mất ngủ','tired','sick','sleep','health'],l:['Con ơi nhớ ngủ cho ngon','Thân khỏe thì chuyện gì còn khó đâu.'],s:'Gia tiên nhắn nhủ',e:'Sleep well, child; with a healthy body, little is truly hard.'},
 sad:{k:['buồn','chán','cô đơn','stress','áp lực','nhớ nhà','lo','sad','lonely','homesick','anxious'],l:['Buồn thì con ghé về nhà','Ông bà vẫn ở đó mà thương con.'],s:'Gia tiên nhắn nhủ',e:'When you are sad, come home; your ancestors are still here, loving you.'},
 family:{k:['ba','mẹ','cha','gia đình','anh','chị','ông','bà','mom','dad','family','parents'],l:['Công cha như núi Thái Sơn','Nghĩa mẹ như nước trong nguồn chảy ra.'],s:'Ca dao',e:'A father\'s toil is like Mount Thai Son, a mother\'s love like a spring that never runs dry.'},
 friend:{k:['bạn','cãi','giận','cự','xích mích','friend','fight','argue'],l:['Lời nói chẳng mất tiền mua','Lựa lời mà nói cho vừa lòng nhau.'],s:'Ca dao',e:'Words cost nothing to say, so choose them to please one another.'},
 keep:{k:['bỏ cuộc','nản','kiên trì','mục tiêu','ước mơ','quit','goal','dream','give up'],l:['Ai ơi giữ chí cho bền','Dù ai xoay hướng đổi nền mặc ai.'],s:'Ca dao',e:'Hold your resolve firm, whichever way others turn.'},
 sorry:{k:['sai','hối','lỡ','xin lỗi','tội','sorry','mistake','regret'],l:['Lỡ chân con nhớ quay đầu','Biết sai mà sửa, ấy câu làm người.'],s:'Gia tiên nhắn nhủ',e:'If you stumble, turn back; knowing you were wrong and mending it is what being a person means.'}
};
const FUNNY=[['Con ơi con hỡi con à','Lo gì mà lo, đi ăn bún riêu.','Child, oh child, why worry? Go eat some bún riêu.'],['Chú kia chú kỉa chú kìa','Lo chuyện đó chi, sao không đi ngủ.','Why fret over that? Go to sleep instead.'],
 ['Ông bà ngồi nghe con kể','Nghe xong ông cười bà cũng cười luôn.','We listened to you talk, and grandpa and grandma are both laughing now.'],['Chuyện nhỏ như con thỏ thôi','Thôi đi cháu, bớt nghĩ nhiều đi nha.','Small stuff, tiny as a rabbit. Stop overthinking it, okay?'],
 ['Bà nội dặn rồi đó nha','Ăn cơm đi rồi tính tiếp cháu ơi.','Grandma already told you: eat first, plan later.'],['Ê cháu nội ơi nghe nè','Hồi xưa ông còn rắc rối hơn con.','Hey grandchild, listen: back in my day I had it even messier.']];
function fallback(text,mode){const tx=text.toLowerCase();if(mode==='funny'){const f=pick(FUNNY);return{luc:f[0],bat:f[1],src:'Gia tiên nhắn nhủ (hơi tếu)',en:f[2]};}
  const keys=Object.keys(BANK),hit=keys.find(k=>BANK[k].k.some(w=>tx.indexOf(w)>=0)),b=BANK[hit||pick(keys)];return{luc:b.l[0],bat:b.l[1],src:b.s,en:b.e};}
function buildPrompt(text,mode,note){return 'Bạn đóng vai "gia tiên": ông bà tổ tiên người Việt hiền hậu, đang nghe con cháu thưa chuyện trước bàn thờ. Con cháu có thể thưa bằng tiếng Việt hoặc tiếng Anh, bạn luôn đáp bằng thơ lục bát tiếng Việt.\nCon cháu thưa: """'+text.slice(0,400)+'"""\n\n'+
 'Hãy đáp bằng ĐÚNG MỘT cặp thơ lục bát: câu lục đúng 6 tiếng, câu bát đúng 8 tiếng (mỗi tiếng là một từ tách bằng khoảng trắng). Đếm kỹ từng tiếng trước khi trả lời.\n'+
 (mode==='funny'?'Phong cách: HÀI HƯỚC, tếu táo, KHÔNG cần vần điệu, giọng ông bà tinh nghịch kiểu "cô kia cô kỉa cô kìa, cô trông xinh quá cái kia thế nào đồ". Vẫn đủ 6 rồi 8 tiếng, vẫn liên quan chuyện của con cháu và ngầm có một lời khuyên thật. Trường "nguon" ghi "Gia tiên nhắn nhủ (hơi tếu)".\n'
 :'Phong cách: NGHIÊM TÚC, ấm áp, đúng luật lục bát (tiếng cuối câu lục vần với tiếng thứ 6 của câu bát). Ưu tiên trích nguyên văn một cặp câu ca dao, Truyện Kiều hoặc thơ có thật nếu thật sự liên quan đến chuyện con cháu thưa (ghi nguồn ở "nguon"); nếu không có câu nào hợp thì tự sáng tác và ghi "Gia tiên nhắn nhủ".\n')+
 'Nếu con cháu có dấu hiệu đau buồn nặng hoặc nghĩ quẩn, bỏ qua phong cách tếu, đáp thật dịu dàng và khuyên tìm người thân hoặc người chuyên môn.\n'+(note||'')+
 'Trường "en" là một câu tiếng Anh tự nhiên diễn đạt ý của cặp thơ.\nChỉ trả về JSON dạng {"luc":"...","bat":"...","nguon":"...","en":"..."}, không giải thích.';}
async function advise(text,mode){let sample=null;try{sample=window.claude&&window.claude.use?await window.claude.use('sample'):null;}catch(e){}
  if(sample){let note='';for(let a=0;a<2;a++){try{const r=await sample.json(buildPrompt(text,mode,note),{cache:false});
      if(r&&cnt(r.luc)===6&&cnt(r.bat)===8)return{luc:String(r.luc).trim(),bat:String(r.bat).trim(),src:String(r.nguon||'Gia tiên nhắn nhủ'),en:String(r.en||'')};
      note='Lần trước sai số tiếng (câu lục có '+cnt(r&&r.luc)+', câu bát có '+cnt(r&&r.bat)+'). Hãy viết lại cho đúng 6 và 8 tiếng.\n';}catch(e){if(e&&(e.code==='not_granted'||e.code==='rate_limited'||e.code==='sampling_disabled'))break;}}}
  return fallback(text,mode);}
$('#mSend').onclick=async()=>{const text=$('#mText').value.trim();if(!text){toast(t('say'));return;}
  showSec('mWait');const mode=Math.random()<.5?'funny':'serious',r=await advise(text,mode);
  $('#p6').textContent=r.luc;$('#p8').textContent=r.bat;$('#pSrc').textContent='— '+r.src;const g=$('#pGist');g.textContent=r.en||'';g.hidden=lang!=='en'||!r.en;showSec('mAns');bell();};

/* ---------- loop ---------- */
let last=performance.now();
const pulse=(ring,on,hov,tm)=>{const o=hov&&on?.95:(on?.38+.32*Math.sin(tm*3.2):0);ring.material.opacity=o;ring.scale.setScalar(on?1+.05*Math.sin(tm*3.2):1);};
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;const tm=now/1000;
  for(let i=tweens.length-1;i>=0;i--){const w=tweens[i];w.t+=dt;const k=clamp(w.t/w.dur,0,1);w.fn(w.ez(k),k);if(k>=1){tweens.splice(i,1);w.res();}}
  gameTick(dt,tm);par.lerp(parT,.04);camera.position.copy(camPos).add(shift).add(par);camera.lookAt(camLook.clone().add(shift).addScaledVector(par,.3));
  const any=anyItems(),off=phase==='offer';
  PLATES.forEach(p=>pulse(p.ring,off&&(!any||p.hover),p.hover,tm));
  pulse(TARGETS.burner.ring,off&&any,TARGETS.burner.hover,tm);[0,1].forEach(vi=>{const T=TARGETS['vase'+vi];pulse(T.ring,(off||phase==='kneel')&&T.hover,T.hover,tm);});pulse(TARGETS.cushion.ring,phase==='kneel',TARGETS.cushion.hover,tm);
  if(flame&&flame.visible){flame.scale.set(1+Math.sin(tm*40)*.15,1+Math.sin(tm*33)*.25,1);}
  if(burnOn)burnLight.intensity=.45+.12*Math.sin(tm*9)+.06*Math.sin(tm*23);
  tickTips();updateSmoke(dt,tm);for(let i=0;i<ANIMS.length;i++)ANIMS[i](tm,dt);renderer.render(scene,camera);}

/* ---------- boot ---------- */
$('#btnSound').onclick=()=>{muted=!muted;$('#snd').style.opacity=muted?.2:1;};
window.addEventListener('resize',resize);
try{localStorage.removeItem('huongve.offer');}catch(e){}
phase='title';applyLang();resize();try{if(sessionStorage.getItem('dd.resume'))skipIntro();}catch(e){}camPos.copy(CAMS.start.pos);camLook.copy(CAMS.start.look);
if(location.hash==='#debug')window.__hv={g:GAMEDBG,start:skipIntro,burn:()=>$('#btnStart').click(),story:afterStory,openNow:()=>{setGate(1);return enterRoom();},plate:i=>{PLATES[i].ids=['xoai','mangcau','chuoi','buoi','thanhlong'];rebuildPlate(i);},light:lightIncense,kneel:()=>setStage('kneel'),mat:openMat,pick:openPicker,setGate,state:()=>phase,fl:setFlowers,cam:(a,b,c,d,e,f)=>{camPos.set(a,b,c);camLook.set(d,e,f);},lang:setLang,
  bank:()=>{const bad=[];Object.values(BANK).forEach(b=>{if(cnt(b.l[0])!==6||cnt(b.l[1])!==8)bad.push(b.l)});FUNNY.forEach(f=>{if(cnt(f[0])!==6||cnt(f[1])!==8)bad.push(f)});return bad;}};
requestAnimationFrame(loop);
})();
